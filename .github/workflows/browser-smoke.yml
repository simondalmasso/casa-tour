name: Visual 3D smoke (manual)
on:
  workflow_dispatch:
  push:
    branches: ["feat/mobile-first-3d-ux"]
    paths:
      - ".github/workflows/browser-smoke.yml"
      - "public/**"
      - "src/**"
      - "tests/browser-smoke.mjs"
permissions:
  contents: read
jobs:
  verify-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install one-off browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 wrangler@4
          npx playwright install --with-deps chromium
      - name: Run local Cloudflare Worker
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > worker-test.log 2>&1 &
          echo $! > worker-test.pid
      - name: Test home and 3D viewer
        run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casa-tour-visual-smoke
          path: |
            test-artifacts/
            worker-test.log
          if-no-files-found: ignore
          retention-days: 3
