name: Cloudflare isolated preview
on:
  workflow_dispatch:
  push:
    branches: ["feat/mobile-first-3d-ux"]
    paths: [".github/workflows/cloudflare-preview.yml"]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current branch
        run: npm run validate
      - name: Check required credentials without disclosing values
        id: cloudflare
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CF_ACCOUNT" && -n "$CF_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets present; preview deployment can proceed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare preview blocked: CLOUDFLARE_ACCOUNT_ID and/or CLOUDFLARE_API_TOKEN not configured."
          fi
      - name: Deploy unique preview (never production)
        if: steps.cloudflare.outputs.available == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PREVIEW_NAME="casa-tour-preview-${GITHUB_SHA:0:8}"
          echo "Deploying isolated Worker $PREVIEW_NAME, not casa-tour"
          npx --yes wrangler@4 deploy --name "$PREVIEW_NAME"
      - name: Summarize deployment status
        if: always()
        run: |
          echo "Only an isolated preview can be created by this workflow."
          echo "Production deploy requires separate verification and release."
